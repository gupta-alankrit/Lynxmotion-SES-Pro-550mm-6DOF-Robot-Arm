realsense_rgbd_viewer:
  ros__parameters:
    color_topic: "/camera/camera/color/image_raw"
    aligned_depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"

    display: true
    mirror_display: false
    print_selected_px_depth: false
    print_interval_sec: 0.25

    selected_px_ratio: 0.5 # (0.5, 0.5) means the selected point is the center pixel.
    selected_py_ratio: 0.5

    depth_units: 0.001
    depth_visualization_scale: 50.0

    sync_queue_size: 10
    sync_slop_sec: 0.05
